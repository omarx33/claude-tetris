<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="pause.css" />
  <link rel="stylesheet" href="records.css" />
  <link rel="stylesheet" href="skins.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>

    <div id="start-screen" class="start-screen">
      <div class="records-panel">
        <h2 class="records-heading">TOP 5 RECORDS</h2>
        <div id="start-scores-table" class="records-table-wrap"></div>
        <div class="records-stats">
          <div class="records-stat">
            <span class="label">MEJOR COMBO</span>
            <span class="value" id="start-best-combo">0</span>
          </div>
          <div class="records-stat">
            <span class="label">LÍNEAS MÁX.</span>
            <span class="value" id="start-max-lines">0</span>
          </div>
        </div>
        <button id="reset-records-btn" class="secondary-btn">Resetear records</button>
      </div>
      <button id="play-btn">JUGAR</button>
    </div>

    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section skins-section">
          <span class="label">SKIN</span>
          <div class="skin-options">
            <button type="button" class="skin-btn" data-skin="retro">Retro</button>
            <button type="button" class="skin-btn" data-skin="neon">Neon</button>
            <button type="button" class="skin-btn" data-skin="pastel">Pastel</button>
            <button type="button" class="skin-btn" data-skin="pixel">Pixel Art</button>
          </div>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="overlay-new-record" class="new-record-form hidden">
          <label for="player-name-input">¡Nuevo record! Introduce tu nombre:</label>
          <input type="text" id="player-name-input" maxlength="12" placeholder="Jugador" autocomplete="off" />
          <button id="save-record-btn">Guardar</button>
        </div>
        <div id="overlay-scores" class="records-table-wrap"></div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-menu" class="pause-menu hidden">
      <div class="pause-menu-box">
        <p class="pause-menu-title">PAUSA</p>

        <div class="pause-menu-field">
          <label for="start-level-input">Nivel inicial</label>
          <input type="number" id="start-level-input" min="1" max="15" value="1" />
        </div>

        <div class="pause-menu-actions">
          <button id="pause-resume-btn">Reanudar</button>
          <button id="pause-restart-btn">Reiniciar</button>
          <button id="pause-controls-btn">Ver controles</button>
        </div>

        <div id="pause-controls-list" class="pause-controls-list hidden">
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
  <script src="pause.js"></script>
  <script src="records.js"></script>
  <script src="skins.js"></script>
</body>
</html>
